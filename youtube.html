<style>
  /* 부모 컨테이너: 본문 너비에 맞추고 정중앙 정렬 */
  .custom-video-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 100%;
    margin: 0 auto; /* 가로 정중앙 정렬 */
    background-color: #000; /* 영상 양옆 여백을 검은색으로 */
  }

  /* 반응형 16:9 박스 */
  .custom-video-box {
    width: 100%;
    /* 위아래 높이를 화면(메뉴바 제외)에 꽉 채우고 싶다면 아래 속성을 씁니다 */
    height: calc(100vh - 60px); /* 60px은 대략 상단 메뉴바 높이입니다. 상황에 맞게 조절 가능 */
    max-height: 100%;
  }

  /* iframe 스타일 */
  .custom-video-box iframe {
    width: 100%;
    height: 100%;
    border: none;
    object-fit: cover; /* 영상을 꽉 채우도록 설정 */
  }
</style>

<div class="custom-video-container">
  <div class="custom-video-box">
    <iframe 
      src="https://www.youtube.com/embed/Twc3twPg7U0" 
      title="YB 시그모음 [6/18]" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>
</div>
