<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    /* 전체 틀 설정 */
    .worldcup-container { width: 100%; margin: 0 auto; font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding: 40px 20px; box-sizing: border-box; border-radius: 12px; }
    .worldcup-title { font-size: 36px; margin-bottom: 15px; font-weight: bold; color: #4b7bec; }
    .worldcup-round { font-size: 24px; margin-bottom: 40px; color: #aaa; }
    
    /* 세로 배치 */
    .worldcup-vs-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; box-sizing: border-box; }
    
    /* 후보 박스 (최대 1000px로 큼직하게) */
    .worldcup-item { width: 100%; max-width: 1000px; background: #2a2a2a; border: 4px solid #444; border-radius: 12px; padding: 25px; box-sizing: border-box; position: relative; }
    
    /* 영상 비율 유지 (16:9) */
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 25px; background: #000; width: 100%; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* 타이머로 영상이 종료되었을 때 덮어씌울 가림막 */
    .video-ended-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; border-radius: 8px; z-index: 10; display: none; }
    
    .item-name { font-size: 26px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; word-break: keep-all; }
    .vs-text { font-size: 50px; font-weight: bold; color: #ff4757; font-style: italic; text-align: center; padding: 20px 0; margin: 10px 0; }
    
    /* 선택 버튼 */
    .select-btn { display: inline-block; width: 100%; padding: 20px 0; font-size: 24px; font-weight: bold; background: #4b7bec; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .select-btn:hover { background: #3867d6; }

    /* 우승 화면 */
    .winner-screen { display: none; padding: 60px 20px; background: #222; border-radius: 12px; border: 4px solid #4b7bec; }
    .winner-title { font-size: 46px; color: #4b7bec; font-weight: bold; margin-bottom: 40px; }
    .restart-btn { margin-top: 40px; padding: 20px 50px; font-size: 26px; font-weight: bold; background: #4b7bec; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>

    currentPairIndex = 0;
    
    document.getElementById("game-zone").style.display = "block";
    document.getElementById("winner-zone").style.display = "none";
    updateRoundInfo();
    showPair();
  }

  function updateRoundInfo() {
    if (items.length === 128) currentRoundName = "128강";
    else if (items.length === 64) currentRoundName = "64강";
    else if (items.length === 32) currentRoundName = "32강";
    else if (items.length === 16) currentRoundName = "16강";
    else if (items.length === 8) currentRoundName = "8강";
    else if (items.length === 4) currentRoundName = "4강";
    else if (items.length === 2) currentRoundName = "결승전";
    else currentRoundName = items.length + "강";
    
    totalPairs = items.length / 2;
  }

  function showPair() {
    clearTimeout(leftTimer);
    clearTimeout(rightTimer);
    document.getElementById("ended-left").style.display = "none";
    document.getElementById("ended-right").style.display = "none";

    const idx = currentPairIndex * 2;
    const left = items[idx];
    const right = items[idx + 1];

    document.getElementById("round-title").innerText = `${currentRoundName} (${currentPairIndex + 1}/${totalPairs})`;
    
    const leftStart = left.start ? `&change_second=${left.start}` : "";
    const rightStart = right.start ? `&change_second=${right.start}` : "";

    document.getElementById("soop-player-left").src = `https://vod.sooplive.co.kr/player/${left.vodId}?embed=true${leftStart}`;
    document.getElementById("soop-player-right").src = `https://vod.sooplive.co.kr/player/${right.vodId}?embed=true${rightStart}`;
    
    document.getElementById("name-left").innerText = left.name;
    document.getElementById("name-right").innerText = right.name;

    if (left.start && left.end) {
      const durationMs = (left.end - left.start) * 1000;
      leftTimer = setTimeout(() => {
        document.getElementById("soop-player-left").src = ""; 
        document.getElementById("ended-left").style.display = "flex"; 
      }, durationMs);
    }

    if (right.start && right.end) {
      const durationMs = (right.end - right.start) * 1000;
      rightTimer = setTimeout(() => {
        document.getElementById("soop-player-right").src = "";
        document.getElementById("ended-right").style.display = "flex";
      }, durationMs);
    }
  }

  function selectItem(selectedIndex) {
    clearTimeout(leftTimer);
    clearTimeout(rightTimer);
    
    const idx = currentPairIndex * 2 + selectedIndex;
    nextRoundItems.push(items[idx]);

    currentPairIndex++;

    if (currentPairIndex < totalPairs) {
      showPair();
    } else {
      if (nextRoundItems.length === 1) {
        showWinner(nextRoundItems[0]);
      } else {
        items = [...nextRoundItems];
        nextRoundItems = [];
        currentPairIndex = 0;
        updateRoundInfo();
        showPair();
      }
    }
  }

  function showWinner(winner) {
    document.getElementById("game-zone").style.display = "none";
    document.getElementById("winner-zone").style.display = "block";
    document.getElementById("winner-name").innerText = winner.name;
    
    const winnerStart = winner.start ? `&change_second=${winner.start}` : "";
    document.getElementById("soop-player-winner").src = `https://vod.sooplive.co.kr/player/${winner.vodId}?embed=true${winnerStart}`;
  }

  function restartGame() {
    initGame();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initGame);
  } else {
    initGame();
  }
</script>

</body>
</html>
