<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    /* 1. 최대 넓이 제한 해제! 100% 꽉 차게 만듭니다 */
    .worldcup-container { width: 100%; max-width: 100%; margin: 0 auto; font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding: 40px; box-sizing: border-box; border-radius: 12px; }
    
    /* 2. 제목과 라운드 글씨 큼직하게 확대 */
    .worldcup-title { font-size: 48px; margin-bottom: 20px; font-weight: bold; color: #4b7bec; }
    .worldcup-round { font-size: 32px; margin-bottom: 40px; color: #aaa; }
    
    .worldcup-vs-wrapper { display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; }
    
    /* 3. 영상 박스 기본 크기를 팍 키움 */
    .worldcup-item { flex: 1; min-width: 600px; background: #2a2a2a; border: 4px solid #444; border-radius: 12px; padding: 30px; box-sizing: border-box; }
    
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 25px; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* 4. 후보 이름과 VS 폰트 확대 */
    .item-name { font-size: 28px; font-weight: bold; margin-bottom: 20px; line-height: 1.5; word-break: keep-all; }
    .vs-text { font-size: 60px; font-weight: bold; color: #ff4757; font-style: italic; padding: 20px; }
    
    /* 5. 선택 버튼도 시원시원하게 */
    .select-btn { display: inline-block; width: 100%; padding: 20px 0; font-size: 28px; font-weight: bold; background: #4b7bec; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .select-btn:hover { background: #3867d6; }

    /* 6. 우승 화면 스케일 업 */
    .winner-screen { display: none; padding: 60px 20px; background: #222; border-radius: 12px; border: 4px solid #4b7bec; }
    .winner-title { font-size: 50px; color: #4b7bec; font-weight: bold; margin-bottom: 40px; }
    .restart-btn { margin-top: 40px; padding: 20px 60px; font-size: 28px; font-weight: bold; background: #4b7bec; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="worldcup-container">
  <div id="game-zone">
    <div class="worldcup-title">🏆 YB 시그니처 영상 월드컵 🏆</div>
    <div id="round-title" class="worldcup-round">4강 1/2</div>
    
    <div class="worldcup-vs-wrapper">
      <div class="worldcup-item">
        <div id="name-left" class="item-name">후보 1</div>
        <div class="video-container">
          <iframe id="soop-player-left" src="" allowfullscreen></iframe>
        </div>
        <button class="select-btn" onclick="selectItem(0)">✅ 이 영상 선택</button>
      </div>

      <div class="vs-text">VS</div>

      <div class="worldcup-item">
        <div id="name-right" class="item-name">후보 2</div>
        <div class="video-container">
          <iframe id="soop-player-right" src="" allowfullscreen></iframe>
        </div>
        <button class="select-btn" onclick="selectItem(1)">✅ 이 영상 선택</button>
      </div>
    </div>
  </div>

  <div id="winner-zone" class="winner-screen">
    <div class="winner-title">👑 최종 우승! 👑</div>
    <div id="winner-video-wrapper" style="max-width: 1200px; margin: 0 auto;">
      <div class="video-container">
        <iframe id="soop-player-winner" src="" allowfullscreen></iframe>
      </div>
    </div>
    <div id="winner-name" class="item-name" style="font-size: 32px; color: #4b7bec; margin-top: 20px;">우승 항목</div>
    <button class="restart-btn" onclick="restartGame()">다시 하기</button>
  </div>
</div>

<script>
  const initialItems = [
    { name: "■ YXL S2-1 ■ 아키마 (10074) - 윤하랑", vodId: "146273259" },
    { name: "■ YXL S10-2 ■ 윈드세븐 (10525) - 후잉", vodId: "176438711" },
    { name: "■ YXL S11-0 ■ NEW 까멘 (10272) - 하랑짱", vodId: "179346333" },
    { name: "■ YXL S8-0 ■ 소다소다? (10054) - 소다", vodId: "166312649" }
  ];

  let items = [];
  let nextRoundItems = [];
  let currentPairIndex = 0;
  let totalPairs = 0;
  let currentRoundName = "";

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function initGame() {
    items = [...initialItems];
    shuffle(items);
    nextRoundItems = [];
    currentPairIndex = 0;
    document.getElementById("game-zone").style.display = "block";
    document.getElementById("winner-zone").style.display = "none";
    updateRoundInfo();
    showPair();
  }

  function updateRoundInfo() {
    if (items.length === 4) currentRoundName = "4강";
    else if (items.length === 2) currentRoundName = "결승전";
    else currentRoundName = items.length + "강";
    
    totalPairs = items.length / 2;
  }

  function showPair() {
    const idx = currentPairIndex * 2;
    const left = items[idx];
    const right = items[idx + 1];

    document.getElementById("round-title").innerText = `${currentRoundName} (${currentPairIndex + 1}/${totalPairs})`;
    
    document.getElementById("soop-player-left").src = `https://vod.sooplive.co.kr/player/${left.vodId}?embed=true`;
    document.getElementById("soop-player-right").src = `https://vod.sooplive.co.kr/player/${right.vodId}?embed=true`;
    
    document.getElementById("name-left").innerText = left.name;
    document.getElementById("name-right").innerText = right.name;
  }

  function selectItem(selectedIndex) {
    const idx = currentPairIndex * 2 + selectedIndex;
    nextRoundItems.push(items[idx]);

    currentPairIndex++;

    if (currentPairIndex < totalPairs) {
      showPair();
    } else {
      if (nextRoundItems.length === 1) {
        showWinner(nextRoundItems[0]);
      } else {
        items = [...nextRoundItems];
        nextRoundItems = [];
        currentPairIndex = 0;
        updateRoundInfo();
        showPair();
      }
    }
  }

  function showWinner(winner) {
    document.getElementById("game-zone").style.display = "none";
    document.getElementById("winner-zone").style.display = "block";
    document.getElementById("winner-name").innerText = winner.name;
    document.getElementById("soop-player-winner").src = `https://vod.sooplive.co.kr/player/${winner.vodId}?embed=true`;
  }

  function restartGame() {
    initGame();
  }

  // 💡 핵심 수정 부분: 페이지 껍데기가 다 불러와지면 그제야 강제로 시작하게 만듦
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initGame);
  } else {
    initGame();
  }
</script>

</body>
</html>
