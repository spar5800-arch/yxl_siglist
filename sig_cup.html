<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    /* 1. 전체 틀: 웹사이트 공간에 맞춰 100% 꽉 차게 */
    .worldcup-container { width: 100%; margin: 0 auto; font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding: 30px 20px; box-sizing: border-box; border-radius: 12px; }
    
    .worldcup-title { font-size: 36px; margin-bottom: 15px; font-weight: bold; color: #4b7bec; }
    .worldcup-round { font-size: 24px; margin-bottom: 30px; color: #aaa; }
    
    /* 2. 🔥 핵심 수정: 무조건 나란히(가로) 서도록 강제 설정 */
    .worldcup-vs-wrapper { display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; }
    
    /* 3. 후보 박스: 고정 크기를 없애고 양쪽에서 각각 42%씩 공간을 차지하게 함 */
    .worldcup-item { width: 42%; background: #2a2a2a; border: 4px solid #444; border-radius: 12px; padding: 20px; box-sizing: border-box; }
    
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 20px; background: #000; width: 100%; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    .item-name { font-size: 20px; font-weight: bold; margin-bottom: 15px; line-height: 1.4; word-break: keep-all; }
    
    /* 4. VS 텍스트: 무조건 가운데 10% 공간에 예쁘게 배치 */
    .vs-text { width: 10%; font-size: clamp(24px, 4vw, 50px); font-weight: bold; color: #ff4757; font-style: italic; text-align: center; padding: 0 10px; }
    
    .select-btn { display: inline-block; width: 100%; padding: 15px 0; font-size: 20px; font-weight: bold; background: #4b7bec; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .select-btn:hover { background: #3867d6; }

    .winner-screen { display: none; padding: 50px 20px; background: #222; border-radius: 12px; border: 4px solid #4b7bec; }
    .winner-title { font-size: 40px; color: #4b7bec; font-weight: bold; margin-bottom: 30px; }
    .restart-btn { margin-top: 30px; padding: 15px 40px; font-size: 24px; font-weight: bold; background: #4b7bec; color: #fff; border: none; border-radius: 8px; cursor: pointer; }

    /* 5. 모바일 배려: 스마트폰처럼 너무 좁은 화면에서만 위아래로 꺾이게 예외 처리 */
    @media (max-width: 768px) {
        .worldcup-vs-wrapper { flex-direction: column; gap: 15px; }
        .worldcup-item { width: 100%; }
        .vs-text { width: 100%; font-size: 30px; padding: 10px 0; }
    }
  </style>
</head>
<body>

<div class="worldcup-container">
  <div id="game-zone">
    <div class="worldcup-title">🏆 YB 시그니처 영상 월드컵 🏆</div>
    <div id="round-title" class="worldcup-round">4강 1/2</div>
    
    <div class="worldcup-vs-wrapper">
      <div class="worldcup-item">
        <div id="name-left" class="item-name">후보 1</div>
        <div class="video-container">
          <iframe id="soop-player-left" src="" allowfullscreen></iframe>
        </div>
        <button class="select-btn" onclick="selectItem(0)">✅ 이 영상 선택</button>
      </div>

      <div class="vs-text">VS</div>

      <div class="worldcup-item">
        <div id="name-right" class="item-name">후보 2</div>
        <div class="video-container">
          <iframe id="soop-player-right" src="" allowfullscreen></iframe>
        </div>
        <button class="select-btn" onclick="selectItem(1)">✅ 이 영상 선택</button>
      </div>
    </div>
  </div>

  <div id="winner-zone" class="winner-screen">
    <div class="winner-title">👑 최종 우승! 👑</div>
    <div id="winner-video-wrapper" style="max-width: 1000px; margin: 0 auto;">
      <div class="video-container">
        <iframe id="soop-player-winner" src="" allowfullscreen></iframe>
      </div>
    </div>
    <div id="winner-name" class="item-name" style="font-size: 32px; color: #4b7bec; margin-top: 20px;">우승 항목</div>
    <button class="restart-btn" onclick="restartGame()">다시 하기</button>
  </div>
</div>

<script>
  const initialItems = [
    { name: "■ YXL S2-1 ■ 아키마 (10074) - 윤하랑", vodId: "146273259" },
    { name: "■ YXL S10-2 ■ 윈드세븐 (10525) - 후잉", vodId: "176438711" },
    { name: "■ YXL S11-0 ■ NEW 까멘 (10272) - 하랑짱", vodId: "179346333" },
    { name: "■ YXL S8-0 ■ 소다소다? (10054) - 소다", vodId: "166312649" }
  ];

  let items = [];
  let nextRoundItems = [];
  let currentPairIndex = 0;
  let totalPairs = 0;
  let currentRoundName = "";

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function initGame() {
    items = [...initialItems];
    shuffle(items);
    nextRoundItems = [];
    currentPairIndex = 0;
    document.getElementById("game-zone").style.display = "block";
    document.getElementById("winner-zone").style.display = "none";
    updateRoundInfo();
    showPair();
  }

  function updateRoundInfo() {
    if (items.length === 4) currentRoundName = "4강";
    else if (items.length === 2) currentRoundName = "결승전";
    else currentRoundName = items.length + "강";
    
    totalPairs = items.length / 2;
  }

  function showPair() {
    const idx = currentPairIndex * 2;
    const left = items[idx];
    const right = items[idx + 1];

    document.getElementById("round-title").innerText = `${currentRoundName} (${currentPairIndex + 1}/${totalPairs})`;
    
    document.getElementById("soop-player-left").src = `https://vod.sooplive.co.kr/player/${left.vodId}?embed=true`;
    document.getElementById("soop-player-right").src = `https://vod.sooplive.co.kr/player/${right.vodId}?embed=true`;
    
    document.getElementById("name-left").innerText = left.name;
    document.getElementById("name-right").innerText = right.name;
  }

  function selectItem(selectedIndex) {
    const idx = currentPairIndex * 2 + selectedIndex;
    nextRoundItems.push(items[idx]);

    currentPairIndex++;

    if (currentPairIndex < totalPairs) {
      showPair();
    } else {
      if (nextRoundItems.length === 1) {
        showWinner(nextRoundItems[0]);
      } else {
        items = [...nextRoundItems];
        nextRoundItems = [];
        currentPairIndex = 0;
        updateRoundInfo();
        showPair();
      }
    }
  }

  function showWinner(winner) {
    document.getElementById("game-zone").style.display = "none";
    document.getElementById("winner-zone").style.display = "block";
    document.getElementById("winner-name").innerText = winner.name;
    document.getElementById("soop-player-winner").src = `https://vod.sooplive.co.kr/player/${winner.vodId}?embed=true`;
  }

  function restartGame() {
    initGame();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initGame);
  } else {
    initGame();
  }
</script>

</body>
</html>
